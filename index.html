<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Love Wrapped 2025 💚</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ===== RESET Y BASE ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
  background: linear-gradient(135deg, #0b141a 0%, #111827 50%, #1e293b 100%);
  color: white;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== PARTÍCULAS ===== */
.particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
}

.particle {
  position: absolute;
  border-radius: 50%;
  background: rgba(37, 211, 102, 0.1);
}

/* ===== CONTENEDOR PRINCIPAL ===== */
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
  position: relative;
  z-index: 1;
}

/* ===== HEADER ===== */
.header {
  text-align: center;
  margin-bottom: 30px;
  animation: slideDown 0.8s ease-out;
}

.header h1 {
  font-size: 2.5rem;
  background: linear-gradient(45deg, #25d366, #00ff88);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 10px;
  text-shadow: 0 5px 15px rgba(37, 211, 102, 0.2);
}

.subtitle {
  color: #94a3b8;
  font-size: 0.95rem;
}

/* ===== TARJETAS ===== */
.card {
  background: rgba(31, 44, 52, 0.85);
  backdrop-filter: blur(10px);
  border-radius: 24px;
  padding: 28px;
  margin-bottom: 25px;
  animation: cardAppear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  border: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
              0 1px 2px rgba(255, 255, 255, 0.05);
  transform-style: preserve-3d;
  perspective: 1000px;
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-5px) rotateX(2deg);
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4),
              0 0 0 1px rgba(37, 211, 102, 0.1);
}

/* ===== LOADER DE GIRO ===== */
.spin-loader {
  width: 80px;
  height: 80px;
  margin: 30px auto;
  position: relative;
}

.spinner {
  width: 100%;
  height: 100%;
  border: 6px solid rgba(37, 211, 102, 0.1);
  border-top: 6px solid #25d366;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

.spin-heart {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 30px;
  color: #ff4081;
  animation: pulse 1.5s ease-in-out infinite;
}

/* ===== COMPONENTES DE INTERFAZ ===== */
.question {
  text-align: center;
  font-size: 1.3rem;
  margin-bottom: 25px;
  line-height: 1.5;
  color: #e2e8f0;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
}

.answer {
  text-align: center;
  font-size: 1.1rem;
  line-height: 1.6;
  padding: 20px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 18px;
  margin: 20px 0;
  animation: textReveal 1s ease;
  border-left: 3px solid #25d366;
}

button, .file-input-wrapper {
  width: 100%;
  padding: 16px;
  border-radius: 16px;
  border: none;
  margin-top: 16px;
  font-size: 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  font-weight: 600;
  cursor: pointer;
}

button {
  background: linear-gradient(135deg, #25d366 0%, #1da851 100%);
  color: white;
  box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(37, 211, 102, 0.4);
}

button:active {
  transform: translateY(0);
}

button.secondary {
  background: rgba(42, 57, 66, 0.8);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}

button.secondary:hover {
  background: rgba(42, 57, 66, 1);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

.file-input-wrapper {
  background: rgba(255, 255, 255, 0.05);
  border: 2px dashed rgba(255, 255, 255, 0.1);
  text-align: center;
  transition: all 0.3s ease;
}

.file-input-wrapper:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: #25d366;
}

.file-input-wrapper input {
  display: none;
}

.file-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  color: #94a3b8;
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 2px;
  margin: 20px 0;
  overflow: hidden;
}

.progress {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #25d366, #00ff88);
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* ===== GRÁFICOS DE RESULTADOS ===== */
.result-graph {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 25px 0;
  gap: 15px;
}

.user-bar {
  flex: 1;
  text-align: center;
  position: relative;
}

.bar-container {
  height: 150px;
  width: 30px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 15px;
  margin: 0 auto 10px;
  position: relative;
  overflow: hidden;
}

.bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  border-radius: 15px;
  transition: height 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.bar.winner {
  background: linear-gradient(to top, #25d366, #00ff88);
  position: relative;
  overflow: hidden;
}

.bar.winner::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255, 255, 255, 0.3),
    transparent
  );
  animation: shine 2s infinite;
}

.bar.loser {
  background: linear-gradient(to top, #ff4081, #ff79a9);
}

.winner-badge {
  position: absolute;
  top: -25px;
  left: 50%;
  transform: translateX(-50%);
  background: #25d366;
  color: white;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: bold;
  animation: pulse 1.5s infinite;
}

/* ===== DÍA INTENSO ===== */
.intense-day {
  background: rgba(255, 64, 129, 0.1);
  border-radius: 15px;
  padding: 15px;
  margin: 20px 0;
  border: 1px solid rgba(255, 64, 129, 0.2);
}

.intense-day-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
  color: #ff4081;
  font-weight: bold;
}

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

.stat-item {
  background: rgba(255, 255, 255, 0.03);
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.stat-value {
  font-size: 1.5rem;
  font-weight: bold;
  color: #25d366;
  display: block;
}

.stat-label {
  font-size: 0.8rem;
  color: #94a3b8;
}

/* ===== ELEMENTOS ESPECIALES ===== */
.year-filter {
  background: rgba(37, 211, 102, 0.1);
  border-radius: 10px;
  padding: 10px;
  text-align: center;
  margin: 10px 0;
  font-size: 0.9rem;
  border: 1px solid rgba(37, 211, 102, 0.2);
}

.year-badge {
  background: linear-gradient(45deg, #25d366, #00ff88);
  color: white;
  padding: 4px 12px;
  border-radius: 20px;
  font-weight: bold;
  display: inline-block;
  margin-left: 5px;
}

.help-text {
  background: rgba(255, 193, 7, 0.1);
  border-radius: 10px;
  padding: 12px;
  margin: 15px 0;
  font-size: 0.85rem;
  border: 1px solid rgba(255, 193, 7, 0.2);
  color: #ffd54f;
  text-align: left;
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  opacity: 0;
  pointer-events: none;
}

.emoji-float {
  font-size: 2rem;
  animation: float 3s ease-in-out infinite;
  display: inline-block;
}

.emoji-pulse {
  animation: pulse 2s ease-in-out infinite;
}

/* ===== ANIMACIONES ===== */
@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes cardAppear {
  from {
    opacity: 0;
    transform: translateY(30px) rotateX(-10deg);
  }
  to {
    opacity: 1;
    transform: translateY(0) rotateX(0);
  }
}

@keyframes textReveal {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

@keyframes shine {
  0% { background-position: -100px; }
  100% { background-position: 200px; }
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes spinCard {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .container { padding: 15px; }
  .card { padding: 20px; margin-bottom: 20px; }
  .header h1 { font-size: 2rem; }
  .question { font-size: 1.1rem; }
}
</style>
</head>

<body>
<div class="particles" id="particles"></div>

<div class="container">
  <div class="header">
    <h1 class="emoji-float">💚 Love Wrapped 2025</h1>
    <p class="subtitle">Tu resumen de amor este año</p>
    <div class="year-filter">
      Solo se analizarán los mensajes del <span class="year-badge">2025</span>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress" id="progress"></div>
  </div>

  <audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2023/03/28/audio_3b1bb0b6ef.mp3">
  </audio>

  <div id="content"></div>
</div>

<script>
// ===== VARIABLES GLOBALES =====
let messages = [], index = 0;
let USER1 = "", USER2 = "";
let winner = null;
let intenseDay = null;
let totalMessages2025 = 0;

// ===== PALABRAS CLAVE =====
const loveWords = ["te amo", "te amoo", "t amo", "amo", "love you"];
const morningWords = ["buenos días", "buen dia", "buenos dias", "good morning"];
const foodWords = ["ya comiste", "ya almorzaste", "con cuidado", "me avisas cuando llegues", "ten cuidado"];
const extraWords = ["te extraño", "amor", "bebé", "bebe", "niñita", "niñito", "pastelito", "cielo", "corazón"];
const laughWords = ["jaja", "😂", "🤣", "jeje", "jiji", "xd", "jajaja", "hahaha"];
const fightWords = ["nunca", "siempre", "mentira", "no", "😡", "😠", "😤", "🤬", "enojado"];

// ===== PREGUNTAS =====
const questions = [
  {q: "💖 ¿Quién dice más 'te amo' este año?", fn: () => count(loveWords), emoji: "💖"},
  {q: "🌞 ¿Quién da más los buenos días?", fn: () => count(morningWords), emoji: "🌞"},
  {q: "🍽️ ¿Quién se preocupa más por el otro?", fn: () => count(foodWords), emoji: "🍽️"},
  {q: "😂 ¿Quién hace reír más?", fn: () => count(laughWords), emoji: "😂"},
  {q: "⚡ ¿Quién inicia más discusiones?", fn: () => count(fightWords), emoji: "⚡"},
  {q: "🥺 ¿Quién dice más 'te extraño'?", fn: () => count(["te extraño", "extraño"]), emoji: "🥺"},
  {q: "💞 ¿Quién usa más apodos cariñosos?", fn: () => count(extraWords), emoji: "💞"},
  {q: "💬 ¿Quién habla más este año?", fn: countMessages, emoji: "💬"},
  {q: "📅 Día más intenso del 2025", fn: showIntenseDay, emoji: "📅"},
  {q: "🏆 Resumen final del año", fn: conclusion, emoji: "🏆"}
];

// ===== INICIALIZACIÓN =====
createParticles();
start();

// ===== FUNCIÓN PRINCIPAL DE INICIO =====
function start() {
  document.getElementById("content").innerHTML = `
    <div class="card">
      <h2 style="text-align:center; margin-bottom:20px" class="emoji-pulse">✨ Sube tu chat de WhatsApp</h2>
      
      <div class="help-text">
        💡 <b>Importante:</b> Asegúrate de exportar el chat <b>sin multimedia</b><br>
        Formato: [30/07/24, 8:02:42 a.m.] Nombre: mensaje
      </div>
      
      <div class="file-input-wrapper" onclick="document.getElementById('fileInput').click()">
        <div class="file-label">
          <div style="font-size: 3rem;">📱</div>
          <div>
            <b>Haz clic para subir tu chat</b><br>
            <small>Archivo .txt exportado de WhatsApp</small>
          </div>
        </div>
        <input type="file" id="fileInput" accept=".txt" onchange="loadChat(event)">
      </div>
      
      <div style="margin-top:15px; font-size:0.85rem; color:#94a3b8; text-align:center;">
        Se analizarán solo los mensajes de 2025
      </div>
      
      <button onclick="toggleMusic()">
        <span>🎶</span> <span id="musicText">Activar música</span>
      </button>
    </div>`;
  updateProgress();
}

// ===== FUNCIONES DE UTILIDAD =====
function updateProgress() {
  const progress = ((index) / questions.length) * 100;
  document.getElementById('progress').style.width = `${progress}%`;
}

function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    const size = Math.random() * 4 + 1;
    particle.style.width = `${size}px`;
    particle.style.height = `${size}px`;
    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;
    particle.style.animationDelay = `${Math.random() * 5}s`;
    particle.style.opacity = Math.random() * 0.3 + 0.1;
    container.appendChild(particle);
  }
}

function toggleMusic() {
  const m = document.getElementById("music");
  const text = document.getElementById("musicText");
  if (m.paused) {
    m.play();
    text.textContent = "Música activada";
  } else {
    m.pause();
    text.textContent = "Activar música";
  }
}

// ===== PARSER MEJORADO =====
function parseWhatsAppChat(text) {
  console.log("=== INICIANDO PARSER ===");
  const lines = text.split('\n');
  const messages = [];
  let currentMessage = null;

  // Expresión regular SUPER flexible
  const patterns = [
    // Formato iPhone con espacios especiales: [30/07/24, 8:02:42 a. m.] Nombre: mensaje
    /^\[?(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*[ \s]*([ap])?\.?\s*m?\.?\s*\]?\s*(.+?):\s*(.+)$/i,
    
    // Formato Android: 21/12/2025, 8:56 a.m. - Nombre: mensaje
    /^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?\s*-\s*(.+?):\s*(.+)$/i,
    
    // Formato 24h: [30/07/24, 20:02:42] Nombre: mensaje
    /^\[?(\d{1,2})\/(\d{1,2})\/(\d{2,4}),?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*\]?\s*(.+?):\s*(.+)$/i
  ];

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;

    // Saltar líneas del sistema
    if (line.includes('están cifrados') || line.includes('encrypted') || line.includes('‎Los mensajes')) {
      continue;
    }

    let match = null;
    for (const pattern of patterns) {
      match = line.match(pattern);
      if (match) break;
    }

    if (match) {
      try {
        let day, month, year, hour, minute, second = 0, ampm, user, msg;
        
        // Determinar qué patrón coincidió
        if (match.length >= 10) {
          // Patrón con AM/PM
          [, day, month, year, hour, minute, second, ampm, user, msg] = match;
          if (!msg) {
            // Si no hay msg, puede que el orden sea diferente
            msg = user;
            user = ampm;
            ampm = second;
            second = 0;
          }
        } else {
          // Patrón 24h
          [, day, month, year, hour, minute, second, user, msg] = match;
          ampm = null;
        }

        // Limpiar valores
        day = parseInt(day);
        month = parseInt(month) - 1;
        hour = parseInt(hour);
        minute = parseInt(minute);
        second = second ? parseInt(second) : 0;
        
        // Manejar año (2 o 4 dígitos)
        year = parseInt(year);
        if (year < 100) {
          year = year < 50 ? 2000 + year : 1900 + year;
        }

        // Convertir AM/PM a 24h
        if (ampm) {
          ampm = ampm.toLowerCase();
          if (ampm.includes('p') && hour < 12) hour += 12;
          if (ampm.includes('a') && hour === 12) hour = 0;
        }

        const date = new Date(year, month, day, hour, minute, second);
        
        // Limpiar nombre de usuario
        user = user.trim().replace(/[^\w\sáéíóúÁÉÍÓÚñÑ❤️✨🥰😊]/gu, '');

        messages.push({
          date: date,
          user: user || "Usuario",
          msg: msg.toLowerCase(),
          dayKey: `${day}/${month + 1}/${year}`,
          lineNumber: i + 1
        });

        currentMessage = messages[messages.length - 1];

      } catch (e) {
        console.log("Error en línea", i + 1, ":", e.message);
      }
    } else if (currentMessage && line) {
      // Continuación del mensaje anterior
      currentMessage.msg += ' ' + line.toLowerCase();
    }
  }

  console.log("Mensajes parseados:", messages.length);
  return messages;
}

// ===== CARGA DEL CHAT =====
function loadChat(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    // Mostrar loading con animación de giro
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div style="text-align:center; padding:30px;">
          <div class="spin-loader">
            <div class="spinner"></div>
            <div class="spin-heart">💚</div>
          </div>
          <h3>Analizando tu chat...</h3>
          <p style="color:#94a3b8; margin-top:10px;">
            Esto puede tomar unos segundos
          </p>
          <div style="margin-top:20px; font-size:0.9rem; color:#94a3b8;">
            <div id="progressText">Leyendo archivo...</div>
          </div>
        </div>
      </div>`;

    setTimeout(() => {
      try {
        document.getElementById('progressText').textContent = "Parseando mensajes...";
        messages = parseWhatsAppChat(reader.result);

        if (messages.length === 0) {
          showParseError();
          return;
        }

        document.getElementById('progressText').textContent = "Filtrando por año 2025...";
        const messages2025 = messages.filter(m => m.date.getFullYear() === 2025);
        totalMessages2025 = messages2025.length;

        if (messages2025.length === 0) {
          const yearsFound = {};
          messages.forEach(m => {
            const year = m.date.getFullYear();
            yearsFound[year] = (yearsFound[year] || 0) + 1;
          });
          showNo2025Messages(yearsFound);
          return;
        }

        messages = messages2025;
        
        document.getElementById('progressText').textContent = "Detectando usuarios...";
        detectarUsuarios();
        
        document.getElementById('progressText').textContent = "Buscando día más intenso...";
        detectarDiaIntenso();
        
        document.getElementById('progressText').textContent = "¡Listo!";
        
        setTimeout(() => showQuestion(), 500);

      } catch (error) {
        console.error("Error:", error);
        showParseError();
      }
    }, 100);
  };
  reader.readAsText(file);
}

// ===== DETECCIÓN DE USUARIOS =====
function detectarUsuarios() {
  const counts = {};
  messages.forEach(m => counts[m.user] = (counts[m.user] || 0) + 1);
  const users = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  
  if (users.length >= 2) {
    USER1 = users[0];
    USER2 = users[1];
    winner = USER1;
  } else if (users.length === 1) {
    USER1 = users[0];
    USER2 = "Persona 2";
    winner = USER1;
  } else {
    USER1 = "Tú";
    USER2 = "Tu pareja";
  }
  
  console.log("Usuarios:", USER1, USER2);
}

// ===== DETECTAR DÍA INTENSO =====
function detectarDiaIntenso() {
  const dayStats = {};
  messages.forEach(m => {
    const dayStr = m.dayKey;
    if (!dayStats[dayStr]) {
      dayStats[dayStr] = { date: m.date, user1Count: 0, user2Count: 0, total: 0 };
    }
    if (m.user === USER1) dayStats[dayStr].user1Count++;
    if (m.user === USER2) dayStats[dayStr].user2Count++;
    dayStats[dayStr].total++;
  });

  let maxMessages = 0;
  for (const dayKey in dayStats) {
    if (dayStats[dayKey].total > maxMessages) {
      maxMessages = dayStats[dayKey].total;
      intenseDay = { ...dayStats[dayKey], dayKey: dayKey };
    }
  }
}

// ===== FUNCIONES DE CONTEO =====
function count(words) {
  let counts = {[USER1]: 0, [USER2]: 0};
  messages.forEach(m => {
    if (words.some(w => m.msg.includes(w))) {
      if (m.user === USER1) counts[USER1]++;
      if (m.user === USER2) counts[USER2]++;
    }
  });
  return format(counts);
}

function countMessages() {
  let counts = {[USER1]: 0, [USER2]: 0};
  messages.forEach(m => {
    if (m.user === USER1) counts[USER1]++;
    if (m.user === USER2) counts[USER2]++;
  });
  return format(counts);
}

// ===== FORMATO DE RESULTADOS =====
function format(o) {
  const a = o[USER1] || 0;
  const b = o[USER2] || 0;
  const total = a + b;
  const categoryWinner = a >= b ? USER1 : USER2;
  const winnerScore = a >= b ? a : b;
  const loserScore = a >= b ? b : a;
  const loserName = categoryWinner === USER1 ? USER2 : USER1;

  setTimeout(() => {
    const bars = document.querySelectorAll('.bar');
    if (bars[0]) bars[0].style.height = total ? `${(winnerScore / total) * 100}%` : '0%';
    if (bars[1]) bars[1].style.height = total ? `${(loserScore / total) * 100}%` : '0%';
  }, 100);

  return `
    <div class="result-graph">
      <div class="user-bar">
        <div class="bar-container">
          <div class="bar winner" style="height:0%"></div>
        </div>
        <div class="winner-badge">🥇</div>
        <b>${categoryWinner}</b><br>
        <span style="color:#25d366">${winnerScore}</span>
      </div>
      <div class="user-bar">
        <div class="bar-container">
          <div class="bar loser" style="height:0%"></div>
        </div>
        <b>${loserName}</b><br>
        <span style="color:#ff4081">${loserScore}</span>
      </div>
    </div>
    ${a === b ? 
      '<div style="text-align:center; margin-top:20px; color:#25d366">💕 ¡Empate perfecto! El amor es 50/50</div>' : 
      `<div style="text-align:center; margin-top:20px; color:#94a3b8">
        ${categoryWinner} lidera con el ${Math.round((Math.max(a, b) / total) * 100)}%<br>
        <small>💖 En el amor de verdad, ambos ganan</small>
      </div>`
    }`;
}

  return `

}

// ===== CONFETI =====
function createConfetti() {
  const colors = ['#25d366', '#ff4081', '#00ff88', '#ff79a9', '#ffffff'];
  for (let i = 0; i < 100; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.style.left = `${Math.random() * 100}%`;
    confetti.style.top = `${Math.random() * 100}%`;
    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    confetti.style.width = `${Math.random() * 10 + 5}px`;
    confetti.style.height = `${Math.random() * 10 + 5}px`;
    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    
    document.body.appendChild(confetti);
    
    confetti.animate([
      { opacity: 1, transform: 'translateY(-100vh) rotate(0deg)' },
      { opacity: 1, transform: `translateY(100vh) rotate(${Math.random() * 720}deg)` }
    ], {
      duration: Math.random() * 3000 + 2000,
      easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
    }).onfinish = () => confetti.remove();
  }
}

// ===== FLUJO PRINCIPAL =====
function showQuestion() {
  if (index >= questions.length) return;
  updateProgress();
  
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="question">
        <span class="emoji-float">${questions[index].emoji}</span>
        ${questions[index].q}
      </div>
      <button onclick="answer()">Ver resultado ✨</button>
      <button class="secondary" onclick="next()">Saltar ➡️</button>
    </div>`;
}

function answer() {
  updateProgress();
  
  // Mostrar animación de giro
  document.getElementById('content').innerHTML = `
    <div class="card">
      <div class="question">${questions[index].q}</div>
      <div class="spin-loader">
        <div class="spinner"></div>
        <div class="spin-heart">💚</div>
      </div>
      <div style="text-align:center; color:#94a3b8; margin-top:20px;">
        Analizando los mensajes de amor...
      </div>
    </div>`;

  // Esperar 3 segundos y mostrar resultados
  setTimeout(() => {
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div class="question">${questions[index].q}</div>
        <div class="answer">${questions[index].fn()}</div>
        <button onclick="next()">
          ${index === questions.length - 1 ? 'Ver resumen final 🏆' : 'Siguiente ➡️'}
        </button>
      </div>`;
  }, 2000);
}

function next() { 
  index++; 
  if (index >= questions.length) {
    document.getElementById('content').innerHTML = `
      <div class="card">
        <div style="text-align:center; padding:30px;">
          <div style="font-size:4rem;">❤️</div>
          <h2>¡Love Wrapped 2025 Completo!</h2>
          <p style="margin:20px 0; color:#94a3b8">
            Analizaste ${totalMessages2025.toLocaleString()} mensajes de 2025
          </p>
          <button onclick="location.reload()">Hacer Otro Año 🔄</button>
          <button class="secondary" onclick="shareResults()">Compartir Resultados 📤</button>
        </div>
      </div>`;
  } else {
    showQuestion(); 
  }
}

function shareResults() {
  const shareText = `💚 Mi Love Wrapped 2025\n\n${USER1} y ${USER2}\n${totalMessages2025} mensajes este año\n\nEl amor no se mide, se vive 💖`;
  
  if (navigator.share) {
    navigator.share({
      title: 'Mi Love Wrapped 2025',
      text: shareText,
      url: window.location.href
    });
  } else {
    navigator.clipboard.writeText(shareText);
    alert('✅ Resultados copiados al portapapeles\n\nPuedes pegarlos en WhatsApp o Instagram');
  }
}
